apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: txn-api-alerts
  namespace: finsecure
spec:
  groups:
    - name: txn-api
      rules:
        - alert: TxnApiHighInvalidRate
          expr: sum(rate(txn_validations_total{result="invalid"}[2m])) > 1
          for: 1m
          labels:
            severity: warning
            team: finsecure
          annotations:
            summary: "More than 1 invalid transaction per second"
