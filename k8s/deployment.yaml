apiVersion: apps/v1
kind: Deployment
metadata:
  name: txn-api
  namespace: finsecure
  annotations:
    kubernetes.io/change-cause: "CHANGE_CAUSE"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: txn-api
  template:
    metadata:
      labels:
        app: txn-api
    spec:
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: txn-api-config
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: txn-api-secret
                  key: api-key
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
